[package]
name = "ascii-image-studio"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Convert images to font-matched ASCII or braille art"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
fontdue = "0.9"
image = "0.25"
rayon = "1.10"
terminal_size = "0.4"

